<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Offer Page</title>
    <meta charset="utf-8">
</head>
<body>
    <div class="container theme-showcase" role="main">
        <div class="jumbotron">
            <h1>My Offer Page</h1>
            <button onclick="sendEvent('click')" class="btn-success">Click me!</button>
        </div>
    </div>

    <script>
        function getURLParameter(name) {
            return decodeURIComponent(
                (new RegExp(name + '=' + '(.+?)(&|$)').exec(location.search) || [, null])[1] || ''
            );
        }

        function sendEvent(event) {
            // Create tracking pixel
            var img = document.createElement('img');
            img.src = `https://8vlr0.bemobtrk.com/conversion.gif?cet=${event}&cid=${getURLParameter('cid')}`;
            img.style.display = 'none';
            document.body.appendChild(img);
            
            // Log to console
            console.log(`😎 BeMob Event - ${event}`);
            
            // Redirect after short delay to ensure tracking fires
            setTimeout(function() {
                window.location.href = "https://www.google.com";
            }, 150);
        }
    </script>
</body>
</html>
